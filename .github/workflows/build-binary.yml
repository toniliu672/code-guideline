name: Release Guidelines Binary

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'templates/**'

permissions:
  contents: write

jobs:
  release-binary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile encrypted ELF binary
        run: bash scripts/build.sh

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Guidelines Binary (Latest)"
          draft: false
          prerelease: false
          files: bin/guidelines
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
